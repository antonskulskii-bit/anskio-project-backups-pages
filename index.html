<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Anskio Project Backups is a personal tool for encrypted source-code backups in Google Drive.">
    <title>Anskio Project Backups</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f8fb;
        color: #16243a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      main { width: min(100% - 2rem, 720px); margin: 0 auto; padding: 5rem 0 3rem; }
      .card { background: #fff; border: 1px solid #dbe3ed; border-radius: 20px; padding: clamp(1.75rem, 5vw, 3.5rem); box-shadow: 0 14px 40px rgb(29 53 87 / 8%); }
      .eyebrow { margin: 0 0 .75rem; color: #2867b2; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 12ch; font-size: clamp(2rem, 7vw, 3.75rem); line-height: 1.04; letter-spacing: -.045em; }
      .lead { max-width: 58ch; margin: 1.5rem 0 0; color: #405674; font-size: clamp(1.05rem, 2.4vw, 1.25rem); line-height: 1.65; }
      .notice { margin: 2rem 0 0; padding: 1rem 1.1rem; border-left: 4px solid #2867b2; border-radius: 0 10px 10px 0; background: #edf5ff; color: #274a75; line-height: 1.55; }
      a { color: #124d93; font-weight: 700; text-underline-offset: .18em; }
      footer { padding: 1.5rem .25rem 0; color: #53657c; font-size: .9rem; }
      @media (prefers-color-scheme: dark) {
        :root { background: #101b2c; color: #eef5ff; }
        .card { background: #17283d; border-color: #314760; box-shadow: none; }
        .lead, footer { color: #bac9dc; }
        .notice { background: #1d3551; color: #d8e8ff; }
        a { color: #9bcbff; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">Personal backup utility</p>
        <h1 id="page-title">Anskio Project Backups</h1>
        <p class="lead">A personal tool for creating and keeping encrypted source-code backups in Google Drive.</p>
        <p class="notice">This application is used by its owner for the owner’s own projects. It is not a public backup service.</p>
        <p><a href="privacy.html">Read the Privacy Policy</a></p>
      </section>
      <footer>© Anskio Project Backups</footer>
    </main>
  </body>
</html>
